# ВАЖНО:
# Для production-аутентификации выбери backend после создания GitHub/Netlify/Decap Turbo setup.
# Репозиторий и branch нужно заменить на свои значения.

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/krishna-pmr
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

locale: "ru"

collections:
  - name: "news"
    label: "Новости"
    folder: "content/ru/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Изображение", name: "image", widget: "image", required: false }
      - { label: "Категории", name: "categories", widget: "list", required: false }
      - { label: "Теги", name: "tags", widget: "list", required: false }
      - { label: "Текст", name: "body", widget: "markdown" }

  - name: "events"
    label: "События"
    folder: "content/ru/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Начало", name: "eventStart", widget: "datetime" }
      - { label: "Окончание", name: "eventEnd", widget: "datetime", required: false }
      - { label: "Место", name: "location", widget: "string", required: false }
      - { label: "Город", name: "city", widget: "string", required: false }
      - { label: "Изображение", name: "image", widget: "image", required: false }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Содержание", name: "body", widget: "markdown" }

  - name: "lectures"
    label: "Лекции"
    folder: "content/ru/lectures"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Лектор", name: "speaker", widget: "string", required: false }
      - { label: "Серия", name: "series", widget: "string", required: false }
      - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "Изображение", name: "image", widget: "image", required: false }
      - { label: "Текст", name: "body", widget: "markdown" }

  - name: "videos"
    label: "Видео"
    folder: "content/ru/videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "YouTube ID", name: "youtube", widget: "string" }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Изображение", name: "image", widget: "image", required: false }
      - { label: "Текст", name: "body", widget: "markdown" }

  - name: "festivals"
    label: "Фестивали"
    folder: "content/ru/festivals"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата начала", name: "startDate", widget: "date" }
      - { label: "Дата окончания", name: "endDate", widget: "date", required: false }
      - { label: "Место", name: "location", widget: "string", required: false }
      - { label: "Изображение", name: "image", widget: "image", required: false }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Содержание", name: "body", widget: "markdown" }

  - name: "about"
    label: "О нас"
    files:
      - label: "Основная страница"
        name: "main"
        file: "content/ru/about/_index.md"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "Текст", name: "body", widget: "markdown" }

  - name: "home_ru"
    label: "Главная — RU"
    files:
      - label: "Главная страница"
        name: "home"
        file: "content/ru/_index.md"
        fields:
          - { label: "Название", name: "title", widget: "string" }
          - { label: "Описание", name: "description", widget: "string" }
          - { label: "Текст", name: "body", widget: "markdown", required: false }

  - name: "home_en"
    label: "Главная — EN"
    files:
      - label: "Home page"
        name: "home"
        file: "content/en/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown", required: false }
